[project]
name = "frda"
version = "0.1.0"
description = "Reproducible mitochondrial transcriptomic signatures in Friedreich's ataxia, from public data only."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<0.16",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
frda = "frda.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frda"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "pipelines"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long messages/regexes stay on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
