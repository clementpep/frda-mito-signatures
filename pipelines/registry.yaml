# Every pipeline that produces a committed result is registered here, so that
# `make reproduce` (verifier, CI, landing workflow) can re-run it from raw data.
# `command` must contain {out}; the pipeline writes all outputs + run.json there.
#
#   - id: P-001
#     task: T-001
#     command: python pipelines/p001_sample_metadata.py --out {out}
#     results_dir: results/P-001-sample-metadata
#     description: GSM sample characteristics for both seed datasets
pipelines:
  - id: P-001
    task: T-001
    command: python pipelines/p001_sample_metadata.py --out {out}
    results_dir: results/P-001-sample-metadata
    description: GSM sample characteristics for both seed datasets
