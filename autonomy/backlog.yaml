version: 1
# Research programme. The worker routine pulls the highest-priority `ready`
# task whose dependencies are `done`. Only the verifier moves a task to `done`.
# Acceptance criteria are what the verifier checks, one by one: keep them
# concrete and checkable.
milestones:
  - id: M1
    title: Credible foundation
    goal: Characterise the two seed datasets and reproduce published results before anything new.
    exit_criteria:
      - Dataset cards with independent units and confounders for GSE104288 and GSE145115.
      - At least one published result reproduced (or refuted) per dataset, gap documented.
  - id: M2
    title: Discovery
    goal: Map what is already known, widen the public data base, derive a candidate mitochondrial signature.
    exit_criteria:
      - State-of-the-art synthesis and gap analysis with explicit novelty gaps (incl. Maddock et al. 2026).
      - At least two additional independent public FRDA datasets ingested.
      - A frozen candidate signature from the discovery set, with sensitivity analyses.
  - id: M3
    title: Independent replication
    goal: Test the frozen signature, as preregistered, in datasets not used to derive it.
    exit_criteria:
      - Preregistration committed before the confirmatory run.
      - Replication / meta-analysis result, positive or negative, reported as such.
  - id: M4
    title: Intervention response
    goal: Test whether interventions move the signature in the preregistered direction.
    exit_criteria:
      - Preregistered intervention analysis executed, with vehicle and inactive-analogue controls.
  - id: M5
    title: Hypothesis generation
    goal: Rank public perturbation signatures that oppose the replicated FRDA signature, as preclinical hypotheses.
    exit_criteria:
      - Connectivity analysis with null distribution and negative controls; no therapeutic claim.
  - id: M6
    title: Preprint
    goal: Submit an open preprint with a full reproducibility package.
    exit_criteria:
      - Manuscript rendered from verified claims only; internal review addressed.
      - Human sign-off on authorship, expert co-author and submission.

tasks:
  # ---------------------------------------------------------------- literature programme (phase A)
  - id: L-001
    title: Literature review protocol (questions, queries, eligibility) — frozen before searching
    milestone: M2
    status: ready
    priority: 1
    kind: literature
    track: literature
    goal: >-
      Finalise research/protocol.md like a systematic-review protocol, so that searching and
      screening are reproducible and not steered by results.
    acceptance:
      - One Europe PMC query per review question (RQ1–RQ4), each tested with `frda lit-search` (hit counts recorded in the protocol) and sized to be screenable (or split).
      - Explicit inclusion/exclusion criteria (years, article types, languages, models) and relevance scale 0–3 definitions.
      - Reading priority rule and per-run reading cap stated.
      - Nothing added to the corpus by this task (searching for real is L-002).

  - id: L-002
    title: Run the protocol searches and build the corpus
    milestone: M2
    status: ready
    priority: 1
    kind: literature
    track: literature
    depends_on: [L-001]
    goal: Execute the frozen queries, save the search logs, add every hit to the corpus as to_screen.
    acceptance:
      - One research/search-logs/*.json per protocol query, produced by `frda lit-search --save`.
      - Every retrieved hit added with `frda lit-add` (ids resolved by Europe PMC; duplicates by DOI merged); counts per query reported in research/screening.md.
      - Seed papers added explicitly (MED:29125828 Napierala 2017, MED:33028632 Vilema-Enríquez 2020, and the Maddock et al. 2026 preprint by its Europe PMC id) with found_by "seed".
      - The `frda lit-verify` audit passes on the added ids (metadata only, no cards yet).

  - id: L-003
    title: Title/abstract screening of the corpus
    milestone: M2
    status: ready
    priority: 2
    kind: literature
    track: literature
    depends_on: [L-002]
    goal: Screen every to_screen paper against the protocol criteria.
    acceptance:
      - Every to_screen paper moved to excluded or to_read with a screen_reason citing the criterion, a relevance 0–3 and topics; at most 150 per run (split the task if more remain, criteria unchanged).
      - research/screening.md PRISMA counts match the corpus exactly.
      - A random sample of 10 decisions per run is listed in the run report for the verifier to re-screen.

  - id: L-004
    title: Reading batch 1 — seed and core papers
    milestone: M2
    status: ready
    priority: 2
    kind: literature
    track: literature
    depends_on: [L-003]
    goal: Read the two seed papers, the Maddock et al. 2026 preprint and the most central reviews.
    acceptance:
      - ≤ 6 reading cards (research/cards/), each with ≥ 3 findings quoted verbatim with location, limitations, datasets, relevance_to; `frda lit-verify` passes on them.
      - Corpus status set to read with the card path; leads proposed as seed ideas where warranted.

  - id: L-005
    title: Reading batch 2 — FRDA transcriptomic studies
    milestone: M2
    status: ready
    priority: 3
    kind: literature
    track: literature
    depends_on: [L-004]
    goal: Read every relevance ≥ 2 paper on FRDA transcriptomics (models, tissues, datasets).
    acceptance:
      - Cards as in L-004, ≤ 6 per run; split into L-005a/b… if more remain (criteria unchanged).
      - For each paper, the datasets used (accessions) and n in independent units are recorded.

  - id: L-006
    title: Reading batch 3 — frataxin, Fe-S clusters and mitochondrial mechanisms
    milestone: M2
    status: ready
    priority: 4
    kind: literature
    track: literature
    depends_on: [L-004]
    goal: Read the relevance ≥ 2 mechanism papers and reviews needed to interpret mitochondrial signatures.
    acceptance:
      - Cards as in L-004, ≤ 6 per run, split if needed.

  - id: L-007
    title: Reading batch 4 — interventions and their molecular readouts
    milestone: M2
    status: ready
    priority: 4
    kind: literature
    track: literature
    depends_on: [L-004]
    goal: Read papers on interventions with molecular readouts in FRDA models (e.g. NRF2 activation/omaveloxolone, HDAC inhibitors, SUV4-20 inhibition, frataxin restoration).
    acceptance:
      - Cards as in L-004, ≤ 6 per run, split if needed; each card states the direction of change of mitochondrial readouts and in which model.

  - id: L-008
    title: Reading batch 5 — methods for cross-dataset signatures
    milestone: M2
    status: ready
    priority: 5
    kind: literature
    track: literature
    depends_on: [L-003]
    goal: Read methods papers on transcriptomic meta-analysis, gene-set testing, small-n designs and connectivity mapping.
    acceptance:
      - Cards as in L-004, ≤ 6 per run; a short methods note in research/synthesis/methods.md citing them, with the choice it implies for this project.

  - id: L-009
    title: State-of-the-art synthesis v1
    milestone: M2
    status: ready
    priority: 3
    kind: literature
    track: literature
    depends_on: [L-005, L-006, L-007, L-008]
    goal: Write chapter 1 (research/synthesis/state-of-the-art.md) from the reading cards only.
    acceptance:
      - Every factual sentence cites [@SRC:ID] of a read paper (research gate passes); no citation from memory.
      - An evidence table (study, model, independent units, finding, dataset) generated from the cards.
      - Points of disagreement between papers stated explicitly.

  # ---------------------------------------------------------------- M1
  - id: T-001
    title: Dataset cards and sample metadata for GSE104288 and GSE145115
    milestone: M1
    status: done
    priority: 1
    kind: data
    track: main
    goal: >-
      Extract GSM-level sample characteristics from GEO (SOFT/MINiML via the allowlisted GEO
      endpoints) for both series, confirm the manifest group mapping, and write one dataset card
      per series.
    acceptance:
      - pipelines/p001_sample_metadata.py writes results/P-001-sample-metadata/{GSE104288,GSE145115}_samples.json (one record per matrix column with GSM id, title, every characteristic) plus run.json via frda.provenance.write_run; registered in pipelines/registry.yaml and reproducible (`make reproduce`).
      - Every matrix column is matched to exactly one GSM; any mismatch with the manifest groups is fixed in the manifest with the evidence quoted in the commit message.
      - docs/datasets/GSE104288.md and docs/datasets/GSE145115.md filled from the template (unit of independence, n per group, age/sex/passage distributions when available, confounders, normalisation of the provided values, terms of use re-checked with URL).
      - Age and sex balance between FRDA and control in GSE104288 reported as numbers (not adjectives).
    notes:
      - Do not guess characteristics; if GEO does not provide one, write "not provided".
    verification: autonomy/verifications/T-001-de7d549.md

  - id: T-002
    title: Quality control of both matrices
    milestone: M1
    status: ready
    priority: 2
    kind: qc
    track: main
    depends_on: [T-001]
    goal: Detect outliers, batch structure and label errors before any biological analysis.
    acceptance:
      - pipelines/p002_qc.py writes results/P-002-qc/ (per-sample summary JSON, PCA coordinates, sample-sample correlation, figures as PNG < 300 KB each) and run.json; registered and reproducible.
      - Sex check — XIST and Y-linked genes (e.g. RPS4Y1, DDX3Y) versus declared sex from T-001; every discordance listed.
      - Outlier rule stated before looking (e.g. median correlation < Q1 − 3·IQR) and applied; flagged samples listed, none silently removed.
      - docs/datasets/*.md updated with a QC section and a decision per flagged sample.

  - id: T-003
    title: Extract reproduction targets from the two seed publications
    milestone: M1
    status: ready
    priority: 1
    kind: reproduction
    track: main
    goal: >-
      Record, with exact location, the published results we will try to reproduce, from Napierala
      2017 (PMID 29125828) and Vilema-Enríquez 2020 (PMID 33028632), read through Europe PMC.
    acceptance:
      - evaluation/reproduction-targets.yaml lists ≥ 2 targets per paper, each with pmid, location (figure/table/section), verbatim published value, the method and thresholds the authors used, and the dataset/columns needed.
      - Targets include the FXN difference FRDA vs control (GSE104288) and the A-196 effect on FXN expression (GSE145115), plus one genome-wide result (e.g. number of DE genes at the paper's thresholds or the highlighted gene families).
      - For each target, the expected gap from method differences (e.g. normalised vs raw counts) is written down BEFORE reproducing.
      - If the full text is not open access, say so and use only what the abstract/figures legally available state.

  - id: T-004
    title: Reproduce the GSE104288 headline results
    milestone: M1
    status: ready
    priority: 2
    kind: reproduction
    track: main
    depends_on: [T-001, T-002, T-003]
    goal: Re-derive the FXN reduction and the genome-wide DE result of Napierala 2017 and document the gap.
    notes:
      - "2026-10-17 (T-022): raw, uniformly re-processed gene counts for GSE104288 appear to exist in recount3 (SRP118922, 35 runs, gene_sums G026; coverage sums, to convert to read counts) — figures from a live probe on 2026-10-17, not saved as an artifact: confirm in T-023. If T-023 allowlists recount3, prefer them for a count-model reproduction and compare with the normalised GEO matrix; manifests support run->sample `column_map` (ENA: run accession -> GSM -> sample title)."
    acceptance:
      - pipelines/p004_reproduce_gse104288.py writes JSON artifacts + run.json (analysis_kind=reproduction); registered and reproducible.
      - Claims added to evaluation/claims.yaml with status reproduced or refuted, source (pmid, location, published_value), checks against the artifact, limitations.
      - docs/reproductions/GSE104288.md reports published vs obtained values side by side, overlap metrics for gene lists (counts, Jaccard, rank correlation of fold changes), and explains each gap.
      - Statistics at donor level (18 vs 17), multiple-testing correction stated.

  - id: T-005
    title: Reproduce the A-196 effect on FXN in GSE145115
    milestone: M1
    status: ready
    priority: 3
    kind: reproduction
    track: main
    depends_on: [T-001, T-003]
    goal: Re-derive the published FXN increase under A-196 (dose response, vs DMSO and SGC2043).
    acceptance:
      - pipelines/p005_reproduce_gse145115.py + artifacts + run.json; registered and reproducible.
      - Claims with evidence_level exploratory (one line per genotype), contrasts within GM04078 only for treatment effects.
      - docs/reproductions/GSE145115.md — published vs obtained, culture replicates explicitly not treated as independent individuals.

  # ---------------------------------------------------------------- M2
  - id: T-006
    title: Gap analysis and seed research leads
    milestone: M2
    status: ready
    priority: 2
    kind: literature
    track: literature
    depends_on: [L-009]
    goal: >-
      From the state-of-the-art synthesis, identify what public FRDA data could still answer, and
      turn it into seed research leads, each traced to papers and to public data.
    acceptance:
      - research/synthesis/gaps.md lists ≥ 5 gaps, each with the papers that establish it ([@SRC:ID] of read papers) and why it is still open (contradiction, untested model, unanalysed dataset, missing method).
      - research/ideas.yaml holds ≥ 5 ideas with status seed, each with question, rationale, sources (corpus ids), data (public accessions or "none known"), and a first publishable_if.
      - The Maddock et al. 2026 preprint (23 FRDA datasets) is explicitly positioned against every idea that touches cross-dataset signatures.
      - No idea status beyond seed (scoring and arbitration belong to the weekly supervision).

  - id: T-007
    title: Mitochondrial gene-set resource
    milestone: M2
    status: ready
    priority: 3
    kind: data
    track: main
    goal: Choose and ingest a versioned mitochondrial gene-set resource with clear terms (e.g. MitoCarta3.0, GO:0005739, HGNC OXPHOS groups).
    acceptance:
      - Terms of use of each candidate quoted with URL; chosen resource added to allowlist.yaml with its terms, plus a manifest-like file data-manifests/genesets/*.yaml with url + sha256.
      - If terms are unclear or restrictive, the task is set to needs_human with the exact question to ask.
      - Gene identifier mapping (symbols vs Ensembl for the two matrices) handled with a public versioned mapping; unmapped rate reported.

  - id: T-008
    title: Census of public FRDA transcriptomic datasets
    milestone: M2
    status: ready
    priority: 3
    kind: data
    track: main
    depends_on: [T-006]
    goal: Find every public, non-DUA FRDA transcriptomic dataset usable for independent replication.
    acceptance:
      - data-manifests/candidates.yaml — accession, model/tissue, assay, n independent units per group, raw counts available, access, publication, independence from GSE104288 donors.
      - GEO E-utilities queries and date recorded; cross-checked with the dataset list of Maddock et al. 2026 when available.
      - A ranked shortlist for replication with the reasoning (tissue relevance, n, independence).

  - id: T-009
    title: Ingest the two best replication datasets
    milestone: M2
    status: ready
    priority: 4
    kind: data
    track: main
    depends_on: [T-008]
    goal: Add manifests (with checksums), dataset cards and QC for the two top-ranked independent datasets.
    acceptance:
      - Two new data-manifests/GSE*.yaml passing the manifests and data_integrity gates.
      - Dataset cards and QC as in T-001/T-002 (pipelines registered and reproducible).

  - id: T-010
    title: Candidate mitochondrial signature in the discovery set (GSE104288)
    milestone: M2
    status: ready
    priority: 4
    kind: analysis
    track: main
    depends_on: [T-004, T-006, T-007]
    goal: Derive a candidate mitochondrial signature FRDA vs control and freeze it for replication.
    acceptance:
      - Exploratory analysis at donor level with gene-set statistics; at least three reasonable parametrisations (normalisation, gene-set definition, covariates age/sex) and leave-one-donor-out stability.
      - The frozen signature (genes + direction + scoring rule) written to results/P-010-signature/signature.json and NOT modified afterwards; claims marked exploratory or single_dataset.
      - Novelty of each candidate claim checked against research/synthesis/ and a logged targeted search (novelty_check points to research/search-logs/*.json or research/synthesis/gaps.md for `new` claims).

  # ---------------------------------------------------------------- M3
  - id: T-011
    title: Preregister the replication (PR-001)
    milestone: M3
    status: ready
    priority: 4
    kind: analysis
    track: main
    depends_on: [T-009, T-010]
    goal: Write preregistrations/PR-001-*.md before touching the replication datasets with the signature.
    acceptance:
      - Front matter complete (hypotheses, primary outcome, expected direction, analysis plan, decision rule incl. what counts as failure to replicate).
      - Committed alone in its own commit, before any confirmatory result exists.

  - id: T-012
    title: Confirmatory replication and meta-analysis
    milestone: M3
    status: ready
    priority: 5
    kind: analysis
    track: main
    depends_on: [T-011]
    goal: Execute PR-001 exactly; report the result whatever it is.
    acceptance:
      - run.json with analysis_kind=confirmatory and preregistration=preregistrations/PR-001-*.md; preregistration gate passes.
      - Random-effects meta-analysis across independent datasets with heterogeneity reported; deviations from PR-001 listed explicitly.
      - Claims with evidence_level preregistered_confirmed only if the decision rule says so; otherwise not_demonstrated.

  # ---------------------------------------------------------------- M4
  - id: T-013
    title: Preregister the intervention hypothesis (PR-002)
    milestone: M4
    status: ready
    priority: 5
    kind: analysis
    track: main
    depends_on: [T-005, T-010]
    goal: State, before looking, the expected direction of A-196 on the frozen signature and the controls.
    acceptance:
      - preregistrations/PR-002-*.md committed alone; vehicle (DMSO) and inactive analogue (SGC2043) as controls; within-line design acknowledged.

  - id: T-014
    title: Intervention response analysis
    milestone: M4
    status: ready
    priority: 6
    kind: analysis
    track: main
    depends_on: [T-013]
    goal: Execute PR-002 on GSE145115 and on any intervention dataset found in T-008.
    acceptance:
      - Confirmatory run referencing PR-002; dose response; claims exploratory (single line) unless more lines exist.

  # ---------------------------------------------------------------- M5
  - id: T-015
    title: Feasibility of a connectivity analysis on public perturbation data
    milestone: M5
    status: ready
    priority: 6
    kind: data
    track: main
    depends_on: [T-012]
    goal: Assess public perturbation-signature resources (e.g. LINCS L1000 on GEO) for size, terms, cell types, compute within a cloud session.
    acceptance:
      - docs/decisions/ ADR with options, terms, sizes, a subsetting plan that fits the session limits, and the null model to use.

  - id: T-016
    title: Connectivity analysis — preclinical hypotheses
    milestone: M5
    status: ready
    priority: 7
    kind: analysis
    track: main
    depends_on: [T-015]
    goal: Rank perturbations that oppose the replicated signature, as hypotheses to examine.
    acceptance:
      - Permutation null, negative-control signatures, cell-type caveats; output wording "hypothesis", never "candidate drug"; claims gate passes.

  # ---------------------------------------------------------------- M6
  - id: T-017
    title: Manuscript skeleton and figure pipelines
    milestone: M6
    status: ready
    priority: 5
    kind: paper
    track: writing
    depends_on: [T-004]
    goal: Start paper/manuscript.md (IMRaD) where every number is a claim token and every result cites a claim.
    acceptance:
      - paper/manuscript.md renders with `frda render-paper` without problems; methods section generated from run.json records (packages, versions, parameters).
      - Figure pipelines registered and reproducible; figures under results/, < 300 KB each.

  - id: T-018
    title: Internal peer review round
    milestone: M6
    status: ready
    priority: 7
    kind: paper
    track: writing
    depends_on: [T-012, T-014, T-017]
    goal: Have the manuscript reviewed as a journal would (statistics, overclaiming, missing controls) and address every point.
    acceptance:
      - docs/review/round-1.md with numbered reviewer points and, for each, the change made or the rebuttal.

  - id: T-019
    title: Human sign-off — authorship, expert co-author, submission
    milestone: M6
    status: needs_human
    priority: 8
    kind: human
    track: writing
    depends_on: [T-018]
    goal: An accountable human author, ideally an FRDA researcher (FARA / AFAF network), validates and submits (bioRxiv + Zenodo DOI).
    acceptance:
      - Done only when the owner records the decision in this task.

  - id: T-020
    title: One-page brief for FRDA researchers
    milestone: M6
    status: ready
    priority: 6
    kind: evidence
    track: writing
    depends_on: [T-004, T-005]
    goal: Draft a one-page, plain-language brief (reproduced / new / not demonstrated) to approach an FRDA researcher early.
    acceptance:
      - docs/outreach/brief.md generated from claims only, with limitations; no outreach is sent by the routine.

  # ---------------------------------------------------------------- infra
  - id: T-021
    title: Research system — literature corpus, reading cards, ideas, effort arbitration, supervision
    milestone: M2
    status: done
    priority: 1
    kind: infra
    track: infra
    attempts: 6
    verification: autonomy/verifications/T-021-ca94e63.md
    goal: >-
      Give the routines the means to work like a PhD student: a verifiable literature memory, a
      registry of research leads with a scoring rubric, effort budgets per track and phase, and a
      weekly supervision that arbitrates (requested by the owner on 2026-10-16).
    notes:
      - "2026-10-16 — owner decision (interactive session): a 4th verification attempt is authorised after 3 CHANGES_REQUESTED. If attempt 4 fails, escalate to NEEDS_HUMAN as usual."
      - "2026-10-17 — owner decision (interactive session): after the attempt-4 NEEDS_HUMAN, a 5th attempt is authorised, scoped to the redesign of verbatim matching proposed by the verifier. If attempt 5 fails, escalate to NEEDS_HUMAN."
      - "2026-10-17 — owner decision (interactive session): after the attempt-5 NEEDS_HUMAN (leading decimal point), a 6th attempt is authorised, scoped to the attempt-5 findings. If attempt 6 fails, escalate to NEEDS_HUMAN."
    acceptance:
      - research/ (plan, protocol draft, corpus, cards template, synthesis skeleton, ideas, RD-001) validated by a new `research` gate (offline cross-references) and unit tests.
      - The `frda lit-search`, `lit-add` and `lit-verify` commands work against Europe PMC; lit-verify rejects a non-existent paper and a quote absent from the text (tested offline with mocks; checked online).
      - The worker's next task is chosen by track budget (pick_next) and the reason is exposed by `frda autonomy-status`; FIX tasks first.
      - Procedures updated (playbooks/literature.md, supervisor.md, watch/worker/verifier); the backlog gains the literature programme L-001…L-009 and T-006 becomes the gap analysis.
      - No existing gate or test weakened; hub summary gains an additive `research` block and task `track`.

  - id: T-022
    title: Wider sources — OpenAlex citation chasing, manifest column maps, verifier follow-up loop
    milestone: M2
    status: done
    priority: 1
    kind: infra
    track: infra
    goal: >-
      Use the owner's OpenAlex key for citation chasing (who cites / what is cited), let manifests
      describe matrices whose columns are run accessions (recount3-style), and make sure
      non-blocking verifier findings become backlog follow-ups instead of being lost.
    acceptance:
      - OpenAlex added to the allowlist with its terms quoted (CC0) and URL; the key is read only from the OPENALEX_API_KEY environment secret, never logged, and redacted from errors (tests).
      - The `frda lit-citations` command resolves OpenAlex works to Europe PMC ids, lists unresolved works without guessing, and writes a search log; tested offline (mocks) and online on MED:29125828.
      - Manifests support `column_map` and `comment_prefix`; `frda.io` and the data_integrity gate use them (test); existing manifests unchanged.
      - verifier.md requires non-blocking findings worth acting on to be recorded as a proposed follow-up task; playbook documents citation chasing; procedures add the secrets rule.
      - T-021 follow-ups addressed where small (literal U+E000 in source, wording of lit-verify scope in docstring and card template); no gate or test weakened.
    attempts: 1
    verification: autonomy/verifications/T-022-056e96a.md

  - id: T-023
    title: Verify terms and allowlist further public sources (MyGene.info, Crossref, Unpaywall, Open Targets, ENA, recount3)
    milestone: M2
    status: ready
    priority: 2
    kind: data
    track: main
    goal: >-
      Each source useful to the project is allowlisted only after its terms of use are read and
      quoted; recount3 raw counts for GSE104288 are declared in its manifest if allowed.
    acceptance:
      - For each candidate source, the terms page is fetched and the relevant sentence quoted with URL and date in data-manifests/allowlist.yaml; a source whose terms cannot be read or restrict this use is NOT added and the reason is recorded in docs/decisions/.
      - Semantic Scholar is assessed against its API License Agreement (accept or reject with the clause quoted).
      - If recount3 is allowlisted, the GSE104288 manifest gains the recount3 gene_sums file (sha256 recorded) with a run->sample column_map built from ENA run metadata (run accession -> GSM -> sample title), and the data_integrity gate passes on it; the values field states that they are coverage sums.
      - Gene identifier mapping (symbols <-> Ensembl) via an allowlisted, versioned source is documented for T-007.

  - id: FIX-022a
    title: T-022 non-blocking follow-ups (citation log truncation, DOI match, comment_prefix, notes)
    milestone: M2
    status: proposed
    priority: 3
    kind: infra
    track: infra
    goal: Address the non-blocking findings of autonomy/verifications/T-022-835d2ad.md.
    notes:
      - "2026-10-17 (T-022 attempt 2): already addressed — citation log records OpenAlex meta.count, examined, truncated and trims to max_hits; DOI resolution requires the hit DOI to match; resolved ids deduplicated; DOI prefix normalised; comment_prefix >= 2 characters; gates.py blank line/comment. Remaining: key as header instead of query parameter (if OpenAlex supports it)."
      - "From autonomy/verifications/T-022-835d2ad.md: record meta.count and truncated in citation logs; check DOI of Europe PMC hit and dedupe; normalise DOI; comment_prefix >= 2 chars; gates.py blank line/comment; mark recount3 figures unverified in T-004 note; consider API key in header."
      - "From autonomy/verifications/T-022-056e96a.md (attempt 2, non-blocking): (a) io.raw_header is not pandas' parser — quoted duplicate header cells and a blank line after comment lines can hide a duplicated column when no column_map is set (the data_integrity gate still catches it via check_columns; load_matrix alone does not): parse with csv.reader after skipping blank lines and call check_columns inside read_manifest_file; (b) read the header with utf-8-sig (BOM + column_map gives a misleading error); (c) a data row longer than the header raises KeyError, which the gate does not catch: catch it and report; (d) _epmc_id strips only 'https://doi.org/' — reuse the regex of _openalex_work_id; (e) run report: mark the ENA/recount3/Crossref/MyGene probe figures as unsaved and unverified; (f) allowlist terms_url for OpenAlex points to a data-licence README, not API terms: read API terms in T-023; (g) T-023: require the run->GSM->title map to be built from saved ENA metadata with its sha256."
    acceptance:
      - Each non-blocking finding of the report is fixed or explicitly declined in the run report; no gate or test weakened.

  - id: T-024
