id: frda-mito-signatures
title: FRDA mitochondrial signatures
subtitle: Mitochondrial transcriptomic signatures in Friedreich's ataxia, from public data only
questions:
  - In the blood of FRDA patients, is a mitochondria-related expression signature present, does it follow gene dosage (controls, carriers, patients), and is it associated with clinical measures (functional stage, GAA repeat length, age at onset, disease duration)?
  - Does it replicate in independent patient cohorts, and is it consistent with patient fibroblasts?
  - Supporting evidence — do interventions in cell models (A-196 in GSE145115) move these signatures in the expected direction?
target: >-
  An open preprint with original, preregistered and independently replicated findings, a full
  reproducibility package and an evidence dossier for FRDA researchers.
disclaimer: >-
  Exploratory research on public data. Expression changes are not causal evidence; cell-model
  responses are not clinical benefit; nothing here is a medical recommendation.
