- id: RT-010
  pmid: '29125828'
  location: Results, 'RNA sequencing identifies differentially expressed genes in CTRL and FRDA primary
    fibroblasts' (paragraph 2; Table S1 cited)
  published_value: FXN expression is significantly decreased ∼2.3-fold in FRDA samples relative to CTRL
    samples (P=4×10−12)
  authors_method: 'RNA-seq of 35 primary skin fibroblast lines, one per donor (18 FRDA, 17 CTRL); TopHat
    2.0.7 / bowtie2 2.1.0 to hg19; fragments per RefSeq gene counted with htseq-count 0.5.3p9; differential
    expression with R/Bioconductor DESeq 1.10.1 (Anders and Huber 2010) on the fragment counts, cutoff
    FDR <= 0.05 (Results also write FDR<0.05). Log2 ratio, Methods verbatim: ''The normalized DESeq counts
    for each sample were used to calculate average log2 expression values for the CTRL and FRDA groups.
    The log2 ratio values for each gene were then calculated as the average log2 expression value for
    the FRDA sample group subtracted by the average log2 expression value for the CTRL sample group.''
    Two readings fit this sentence: (G) mean over samples of log2 normalised counts, FRDA minus CTRL;
    (A) log2 of the arithmetic group mean of normalised counts, FRDA minus CTRL (= log2 of DESeq 1.x foldChange,
    baseMeanB/baseMeanA). Which one the authors used is not settled by the text (rule to decide it: RT-013).
    Gene filter stated three ways: Results ''16,531 transcripts were detected using a threshold of ≥10
    tags in at least one sample''; Methods ''Only genes with more than 10 fragments in all the samples'';
    GEO (P-001 metadata) ''Genes with less than 10 fragments in all the samples were removed''. The GEO
    matrix has 16,531 rows, matching the Results wording. Groups ''matched for sex and age of sampling''
    (7 F / 11 M FRDA, 9 F / 8 M CTRL, paper; sex is not a GEO field). No outliers removed (Fig. S1). The
    sentence opens with ''As previously published'' (Li et al. 2015b, same RNA-seq data); neither paper
    text read here states how the ~2.3-fold or P=4x10^-12 for FXN was computed (DESeq test assumed, not
    stated).'
  dataset: GSE104288
  columns_needed: 'GSE104288_DESeq_counts.txt.gz: row gene == ''FXN'' (present, read 2026-11-13); 35 sample
    columns, group from the manifest (18 F*, 17 C* titles, matched to GSMs by P-001)'
  expected_gap: 'Written before reproducing. (1) Input: GEO provides DESeq-normalised, non-integer values
    only (16,531 genes x 35 donors), not the htseq counts; DESeq 1.10.1 (negative binomial, per-condition
