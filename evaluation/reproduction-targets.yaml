- id: RT-008
  pmid: '29790959'
  location: Results, 'Functional disability stage' (Fig. 6C) and 'Enrichment analysis of significant modules'
  published_value: the yellow module (coeff. = −0.0093, log BF = 3.01, pp = 1.0) | Enrichment analysis
    of yellow module indicated enrichment for rRNA processing (44 genes, log BF = 2.98) and the mitochondrial
    respiratory chain complex (20 genes, log BF = 1.89)
  authors_method: 'WGCNA on the patient-only set with complete phenotypes; input corrected for batch with
    ComBat ONLY (no age/sex removal, ''the network construction step must be performed on data that has
    not any source of biological variation removed''); signed network, soft power 6, module merge dissimilarity
    threshold 0.2; 6 outliers removed, 15,198 probes; hub genes by scaled connectivity; eight modules.
    Eigengenes tested with the FDS regression design, age removed, log BF > 0.5. Enrichment: log BF from
    a hypergeometric overlap test implemented in BayesFactor, gene sets from Enrichr (GO BP 2015, GO MF 2015 (the paper writes ''GO Molecular Process 2015'', read here as Molecular Function: our interpretation), KEGG 2016, Reactome 2016).'
  dataset: GSE102008
  columns_needed: status==Patient, functional stage, Sex, rin, expression matrix; gene symbols for enrichment
    (probe annotation)
  expected_gap: 'Written before reproducing. Known and fixed by the paper: soft power 6, signed network,
    merge 0.2, ComBat-only input. Unknown or different: (1) exact patient subset (308 vs GEO) and probe
    set (15,198 after filtering and collapse; our collapse may differ); (2) module-to-colour assignment
    is arbitrary, so modules are matched by gene overlap and by enrichment, never by colour name; (3)
    eigengene sign convention, so coefficients are compared by sign and order of magnitude only; (4) enrichment
    log BF requires the same Enrichr libraries (versions 2015/2016) which we may not be able to obtain;
    if unavailable, say so and compare categories only. Matching rule (fixed now): our module matched to the paper''s one = the module with the largest gene
    overlap (hypergeometric p < 0.05) with the published module''s gene list (supplementary module gene lists; if not obtainable, not assessable and NOT reproduced), else not matched (an enrichment-only
    match is circular with the pass test and is excluded from ''reproduced''); ''top enriched terms'' = the 5 terms with the highest
    log BF pooled across the four libraries (arbitrary choice, fixed now). Pass criterion (set before reproducing): a matched
    module with negative association with FDS (log BF > 0.5) whose top enriched terms include the same
    category (respiratory chain complex for yellow; mitochondrial translation for red). Anything else
    is ''not reproduced'', reported as such.'
