# Published results we try to reproduce (filled by T-003, completed by T-027). One entry per target:
#   - id: RT-001
#     pmid: '29125828'
#     location: Figure / table / section
#     published_value: verbatim
#     authors_method: tool, normalisation, thresholds
#     dataset: GSE104288
#     expected_gap: written BEFORE reproducing
#   columns_needed: data columns the reproduction needs (added by T-027)
# Source for all RT-*: Nachun et al. 2018, Hum Mol Genet, PMC6097013 (CC BY-NC), full text read through Europe PMC 2026-11-07.
targets:
- id: RT-001
  pmid: '29790959'
  location: Results, 'Differential expression' (Fig. 1, Table 2)
  published_value: 829 transcripts were DE between patients and controls (global FDR = 0.012)
  authors_method: 'BayesFactor linear model per gene; age and sex were regressed out beforehand (median
    posterior estimates, ''Removal of confounding covariates''), then full model = intercept + disease
    status + RIN vs null = intercept + RIN; log10 BF > 0.5 for status; pairwise DE if pp > 0.95. Preprocessing:
    lumi VST + RSN, 17 outliers removed (full set), ComBat, detection-score and annotation filtering,
    duplicate probes collapsed to one per gene (WGCNA collapseRows, maxMean): 16,099 features in the full
    dataset. Posterior estimates: 10,000 MCMC iterations, random seed 12,345 (Methods). Posterior probability (pp) definitions differ in the paper: DE contrasts, fraction of posterior
    samples non-zero with the same sign as the median; phenotype regression, fraction non-zero ''whose
    sign was opposite that of the median estimate''. Global FDR = mean of (1 - pp) over the genes called;
    it is NOT a multiplicity correction (the paper states Bayes factors need none). '
  dataset: GSE102008
  columns_needed: status (Patient/Carrier/Control), rin, ILMN probe id x sample expression matrix (series
    matrix, processed)
  expected_gap: 'Written before reproducing. Sources of difference: (1) cohorts: paper 418/228/93 vs GEO
    411/228/94; 7 patients absent from GEO and not reconcilable (card GSE102008.md); the 2 low-frataxin
    controls cannot be identified, the frataxin exclusion is not applicable; GEO patient mean age differs
    from the paper''s (see card), which matters for age removal. (2) Tested universe and unit: paper counts
    ~16k gene-level rows (probes collapsed by maxMean); the GEO matrix has detection/annotation filtering
    but no documented collapse to genes, so the reproduction must declare its own collapse and the counts
    are not comparable one-to-one. (3) Covariates: the reproduction must choose between replicating the
    paper''s residualisation of age and sex and adjusting them differently (card flags this for T-028);
    either choice moves the counts. (4) Method: BayesFactor default priors, MCMC posterior; we are not
    bound to the same engine. Pass criterion (set before reproducing): ordering patients-vs-carriers >
    patients-vs-controls > carriers-vs-controls in DE counts (this ordering is derived from the published
    counts; the paper explains it by sample size); counts within a factor 2 of the published ones reported
    as ''same order'', otherwise ''not reproduced''; overlap reported as a number: Jaccard index of our DE set vs the full published DE gene list
    (Supplementary Table S2, to be fetched from the paper''s supplementary files; if it cannot be obtained,
    overlap is ''not assessable'' and counts as NOT reproduced, never as a pass) and, on the shared genes
    only, the fraction with the same sign of effect (patients minus comparator). Thresholds fixed now,
    judgement calls without a calibration: Jaccard >= 0.3 and sign concordance >= 0.9 on >= 50 shared genes
    (our pipeline re-implements preprocessing and engine, so identity is not expected); the Jaccard expected
    by chance given our feature count and the published set size is reported alongside. For RT-004 (1115
    transcripts, effect of disease status across the three groups) the criterion is the same count rule
    (factor 2); the paper''s 1078/829/182 are subsets of the 1115 (pairwise calls made among the omnibus
    set), so we report whether our pairwise calls are restricted likewise; that is a hierarchy consistency
    check, not reproduction evidence. Exact equality is neither expected nor required.'
