- id: RT-005
  pmid: '29790959'
  location: Results, 'Regression with clinical phenotypes' (Fig. 2, Table 3; quote truncated before the paper''s '', Fig. 2, Table 3, ...)'' so that it is an exact substring)
  published_value: we identified 1508 transcripts significantly associated with FDS (global FDR = 0.0028
  authors_method: 'BayesFactor per gene in patients with complete phenotypes (n = 308; compound heterozygotes
    excluded); age removed (collinear with all three measures); full model = intercept + phenotype (FDS,
    GAA1 or duration = age at draw - age of onset) + sex + RIN vs null without the phenotype; log BF >
    0.5 and pp > 0.95; Posterior estimates: 10,000 MCMC iterations, random seed 12,345 (Methods). Posterior probability (pp) definitions differ in the paper: DE contrasts, fraction
    of posterior samples non-zero with the same sign as the median; phenotype regression, fraction non-zero
    ''whose sign was opposite that of the median estimate''. This second wording is probably a typo in the paper (read as the same sign as the median); our interpretation, not a published statement. Global FDR = mean of (1 - pp) over the genes
    called; it is NOT a multiplicity correction (the paper states Bayes factors need none). Patient-only
    dataset: 6 outliers removed, 15,198 probes.'
  dataset: GSE102008
  columns_needed: status==Patient, functional stage, gaa1, duration, Sex, rin, expression matrix. No genotype
    key exists among the 13 GEO characteristic keys (card GSE102008.md), so the 18 compound heterozygotes
    cannot be identified or excluded
  expected_gap: 'Written before reproducing. (1) Subset: paper n = 308; GEO has 411 patients with variable
    completeness of functional stage / gaa1 / duration; our n is counted and reported before analysis.
    (2) Compound heterozygotes cannot be excluded (no genotype field). (3) Gene-level collapse and age
    residualisation as for the DE targets. (4) Duration has no unit in GEO (equals age - onset in 407/407
    patients). (5) Engine differs (BayesFactor vs ours). Pass criterion (set before reproducing): ordering
    of counts FDS > GAA1 > duration (derived from the published counts, not a published claim); same order
    of magnitude (factor 2 for FDS, factor 3 for GAA1, duration reported as small, <= 50); sign agreement
    of the top genes of Table 3 reported as a number.'
